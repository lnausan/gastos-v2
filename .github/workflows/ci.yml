name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "test-key"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "test-project.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "test-project"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "test-project.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: "test-app-id"

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Debug environment
      run: |
        echo "=== ENVIRONMENT DEBUG ==="
        echo "Node version: $(node --version)"
        echo "pnpm version: $(pnpm --version)"
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo "Environment variables:"
        echo "NEXT_PUBLIC_FIREBASE_API_KEY: $NEXT_PUBLIC_FIREBASE_API_KEY"
        echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID: $NEXT_PUBLIC_FIREBASE_PROJECT_ID"
        echo "=== END ENVIRONMENT DEBUG ==="
      continue-on-error: true

    - name: Install dependencies
      run: |
        echo "=== INSTALLING DEPENDENCIES ==="
        pnpm install --frozen-lockfile
        echo "=== DEPENDENCIES INSTALLED ==="
      continue-on-error: true

    - name: Debug dependencies
      run: |
        echo "=== DEPENDENCIES DEBUG ==="
        echo "Installed packages:"
        pnpm list --depth=0
        echo "=== END DEPENDENCIES DEBUG ==="
      continue-on-error: true

    - name: Type check
      run: |
        echo "=== RUNNING TYPE CHECK ==="
        pnpm run type-check
        echo "=== TYPE CHECK COMPLETED ==="
      continue-on-error: true

    - name: Lint
      run: |
        echo "=== RUNNING LINT ==="
        pnpm run lint
        echo "=== LINT COMPLETED ==="
      continue-on-error: true

    - name: Build
      run: |
        echo "=== RUNNING BUILD ==="
        pnpm run build
        echo "=== BUILD COMPLETED ==="
      continue-on-error: true

    - name: Debug build output
      run: |
        echo "=== BUILD OUTPUT DEBUG ==="
        if [ -d ".next" ]; then
          echo "Build directory exists"
          ls -la .next/
        else
          echo "Build directory does not exist"
        fi
        echo "=== END BUILD OUTPUT DEBUG ==="
      continue-on-error: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: .